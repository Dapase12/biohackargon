# Supabase Configuration for Argon Biohacking Platform
# Run: supabase start (local) or supabase deploy --project-ref <ref> (remote)

project_id = "argon-biohack"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[edge_runtime]
enabled = true

[functions]
  [functions.sleep-webhook]
  verify_jwt = false
  import_map = "functions/sleep-webhook/import_map.json"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external]
  [auth.external.google]
  enabled = true
  client_id = "local-dev-client-id"
  secret = "local-dev-secret"

  [auth.external.apple]
  enabled = true
  client_id = "local-dev-client-id"
  secret = "local-dev-secret"

[auth.email]
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
ip_version = "IPv4"

[analytics]
enabled = false