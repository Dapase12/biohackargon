name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run all tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          # This will fail if thresholds not met (configured in vitest.config.ts)
          echo "Coverage check completed"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build/serve app for testing
        run: |
          # Start a simple HTTP server for the PWA
          npx serve . -l 3000 &
          sleep 5

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit --skipLibCheck || true
        # Note: This project uses vanilla JS, so tsc check is optional

      - name: Check for console.log statements
        run: |
          # Warn about console.log in source files (excluding test files)
          if grep -r "console\.log" --include="*.js" --exclude-dir=node_modules --exclude-dir=tests --exclude="*.test.js" .; then
            echo "⚠️ Found console.log statements in source files"
            exit 1
          fi

  validate-config:
    name: Validate Config Files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package.json
        run: npm pkg get name version scripts

      - name: Validate manifest.json
        run: |
          cat manifest.json | python3 -m json.tool > /dev/null
          echo "manifest.json is valid JSON"

      - name: Validate sw.js syntax
        run: |
          node --check sw.js
          echo "sw.js syntax OK"

      - name: Validate JS files syntax
        run: |
          for f in *.js; do
            node --check "$f" && echo "$f OK"
          done

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-and-integration, e2e, lint-and-typecheck, validate-config]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Unit & Integration: ${{ needs.unit-and-integration.result }}"
          echo "E2E: ${{ needs.e2e.result }}"
          echo "Lint & Typecheck: ${{ needs.lint-and-typecheck.result }}"
          echo "Validate Config: ${{ needs.validate-config.result }}"

          if [ "${{ needs.unit-and-integration.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.validate-config.result }}" != "success" ]; then
            echo "❌ Some jobs failed"
            exit 1
          fi

          echo "✅ All tests passed!"