# CI Pipeline for Argon Biohacking PWA (v7.0)
# Runs on every push and PR to master

name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Node.js build & tests (Vitest)
  node-build-test:
    name: Node Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (ETL only)
        run: npx tsc --noEmit src/etl/**/*.ts

      - name: Run tests (Vitest)
        run: npm test

      - name: Build CSS & JS (esbuild)
        run: npm run build

  # Edge Functions linting (Deno)
  edge-functions-lint:
    name: Edge Functions Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.40.0

      - name: Lint Edge Functions
        run: |
          deno lint supabase/functions/sleep-webhook/index.ts
          deno lint supabase/functions/strain-webhook/index.ts

      - name: Check formatting
        run: |
          deno fmt --check supabase/functions/sleep-webhook/index.ts
          deno fmt --check supabase/functions/strain-webhook/index.ts

  # Deploy Edge Functions (on master branch only)
  deploy-edge-functions:
    name: Deploy Edge Functions
    needs: [node-build-test, edge-functions-lint]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy sleep-webhook --project-ref $SUPABASE_PROJECT_REF
          supabase functions deploy strain-webhook --project-ref $SUPABASE_PROJECT_REF

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase secrets set PYTHON_PIPELINE_URL="${{ secrets.PYTHON_PIPELINE_URL }}" --project-ref $SUPABASE_PROJECT_REF

  # Deploy to GitHub Pages (on master branch only)
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate syntax
        run: |
          node --check argon-mbe.js
          node --check simulate-recovery.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          echo "✅ All syntax checks passed"

      - name: Run recovery simulation (smoke test)
        run: |
          node simulate-recovery.js 2>&1 | tail -30
          echo "✅ Simulation completed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4