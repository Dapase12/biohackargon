[project]
name = "argon_algorithms"
version = "0.1.0"
description = "OpenStrap algorithm migration for Argon biohacking platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "scipy>=1.13.0",
]
optional-dependencies = {
    "dev" = [
        "pytest>=8.2.0",
        "pytest-cov>=5.0.0",
        "pytest-asyncio>=0.23.0",
        "ruff>=0.5.0",
        "mypy>=1.10.0",
    ]
}

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argon_algorithms*"]
exclude = ["tests*", "validation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=argon_algorithms --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true